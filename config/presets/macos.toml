# macOS defaults for a MacBook (Sonoma/Sequoia). Reference only — hyprpower
# never applies a preset directly; copy it to policy.toml and edit.
#
# macOS anchors everything on display-off: the backlight fades ~15s before it
# cuts, and the session locks at the same instant, because "Require password
# after..." defaults to Immediately.

[display]
dim_to = "10%"
off_method = "dpms"

[idle.ac]
dim           = "9m45s"
backlight_off = "10m"
display_off   = "10m"
lock          = "10m"
suspend       = false      # "prevent automatic sleeping when display is off"

[idle.battery]
dim           = "1m45s"
backlight_off = "2m"
display_off   = "2m"
lock          = "2m"
suspend       = "varies"   # model-dependent; Apple publishes no table

[lid]
ac      = "suspend"
battery = "suspend"

[button.power]
ac      = "suspend"
battery = "suspend"
