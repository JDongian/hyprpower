[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprpower"
version = "0.1.0"
description = "See every power setting on a Linux laptop in one place, next to what macOS and Windows would do."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Dong", email = "jdong42@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "tomlkit"]

[project.scripts]
hyprpower = "hyprpower.cli:main"

[tool.setuptools]
packages = ["hyprpower"]

# The default profile ships inside the package, so an installed copy can
# name a path that exists when it tells you where to seed from.
[tool.setuptools.package-data]
hyprpower = ["default.toml"]
